<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="manifest.webmanifest" />
    <title>Frustum</title>
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
      { "imports": { "three": "./vendor/three/three.module.min.js" } }
    </script>
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="hud" hidden>
      <div id="score"></div>
      <div id="feed"></div>
      <div id="stats"></div>
      <button id="mute" aria-label="소리 켜기/끄기">🔊</button>
      <div id="dead" hidden>탈락했습니다<span id="deadBy"></span><br /><b id="respawn"></b></div>
      <div id="banner" hidden><b id="bannerTitle"></b><span id="bannerSub"></span></div>
      <div id="stick"><div id="knob"></div></div>
      <button id="attack" class="skill" data-label="손전등" aria-label="손전등 공격"><span>손전등</span></button>
      <button id="roll" class="skill" data-label="구르기" aria-label="구르기"><span>구르기</span></button>
      <button id="flare" class="skill" data-label="조명탄" aria-label="조명탄"><span>조명탄</span></button>
    </div>

    <div id="menu">
      <h1>FRUSTUM</h1>
      <p>보이는 것은 내 시야뿐. 시야 밖에서 기습하세요.</p>
      <input id="name" maxlength="12" placeholder="닉네임" autocomplete="off" />
      <div id="modes">
        <button id="modeFfa">개인전<small>8인 생존</small></button>
        <button id="modeDuo">2인 팀전<small>2명 × 4팀 생존</small></button>
      </div>
      <button id="play">혼자 하기 (봇전)</button>
      <button id="online" class="alt">온라인 접속</button>
      <small>부활 없는 생존전: 마지막까지 살아남으면 승리. 손전등 빔으로 적을 비추면 처치. 구르는 동안은 무적, 조명탄은 주변을 밝혀 팀에게 보여줍니다.<br />모바일: 왼쪽 드래그 이동 · 오른쪽 드래그 회전 · 버튼으로 스킬<br />PC: WASD 이동 · 마우스 드래그/←→ 회전 · Space 공격 · Shift 구르기 · F 조명탄</small>
      <div id="status"></div>
    </div>

    <script type="module" src="main.js"></script>
  </body>
</html>
