<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="manifest.webmanifest" />
    <title>Frustum</title>
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
      { "imports": { "three": "./vendor/three/three.module.min.js" } }
    </script>
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="hud" hidden>
      <div id="score"></div>
      <div id="feed"></div>
      <div id="stats"></div>
      <button id="mute" aria-label="소리 켜기/끄기">🔊</button>
      <button id="gear" aria-label="설정">⚙️</button>
      <div id="dead" hidden>탈락했습니다<span id="deadBy"></span><br /><b id="respawn"></b></div>
      <div id="banner" hidden><b id="bannerTitle"></b><span id="bannerSub"></span></div>
      <div id="stick"><div id="knob"></div></div>
      <button id="attack" class="skill" data-label="손전등" aria-label="손전등 공격"><span>손전등</span></button>
      <button id="roll" class="skill" data-label="구르기" aria-label="구르기"><span>구르기</span></button>
      <button id="flare" class="skill" data-label="조명탄" aria-label="조명탄"><span>조명탄</span></button>
    </div>

    <div id="menu">
      <h1>FRUSTUM</h1>
      <p>보이는 것은 내 시야뿐. 시야 밖에서 기습하세요.</p>
      <input id="name" maxlength="12" placeholder="닉네임" autocomplete="off" />
      <div id="rules" class="pick">
        <button id="ruleDm">데스매치<small>3분 · 최다 킬</small></button>
        <button id="ruleScore">점수제<small>목표 킬 선취</small></button>
        <button id="ruleSurvival">서바이벌<small>부활 없음</small></button>
      </div>
      <div id="modes" class="pick">
        <button id="modeFfa">개인전<small>8명 각자</small></button>
        <button id="modeDuo">2인 팀전<small>2명 × 4팀</small></button>
      </div>
      <button id="play">혼자 하기 (봇전)</button>
      <button id="online" class="alt">온라인 접속</button>
      <button id="openSettings" class="alt">⚙️ 설정</button>
      <small>손전등 빔으로 적을 비추면 처치. 구르는 동안은 무적, 조명탄은 주변을 밝혀 팀에게 보여줍니다.<br />모바일: 왼쪽 드래그 이동 · 오른쪽 드래그 회전 · 버튼으로 스킬<br />PC: WASD 이동 · 마우스 드래그/←→ 회전 · Space 공격 · Shift 구르기 · F 조명탄</small>
      <div id="status"></div>
    </div>

    <div id="settings" hidden>
      <div class="panel">
        <h2>설정</h2>
        <label><span>조이스틱 고정<small>항상 같은 자리에 표시</small></span><input type="checkbox" id="setFixed" /></label>
        <label><span>왼손 모드<small>조이스틱과 버튼 좌우 반전</small></span><input type="checkbox" id="setLefty" /></label>
        <label><span>회전 감도 <b id="sensVal"></b></span><input type="range" id="setSens" min="0.4" max="2.5" step="0.1" /></label>
        <label><span>효과음 크기 <b id="volVal"></b></span><input type="range" id="setVol" min="0" max="1" step="0.05" /></label>
        <label><span>진동<small>처치하거나 당했을 때</small></span><input type="checkbox" id="setVibrate" /></label>
        <label><span>성능 정보 표시<small>fps, 드로우콜 등</small></span><input type="checkbox" id="setStats" /></label>
        <button id="closeSettings">닫기</button>
        <button id="leave" class="alt" hidden>게임 나가기</button>
      </div>
    </div>

    <script type="module" src="main.js"></script>
  </body>
</html>
