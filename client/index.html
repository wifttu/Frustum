<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="manifest.webmanifest" />
    <title>Frustum</title>
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
      { "imports": { "three": "./vendor/three/three.module.min.js" } }
    </script>
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="hud" hidden>
      <div id="labels"></div>
      <div id="nums"></div>
      <div id="mePanel">
        <div class="row"><b id="lvBadge">LV 1</b><div class="bar xp"><div id="xpFill"></div><span id="xpText"></span></div></div>
        <div class="row"><div class="bar hp"><div id="hpFill"></div><span id="hpText"></span></div><span id="timeChip"></span></div>
      </div>
      <div id="board"></div>
      <div id="choices" hidden><div id="choiceTitle">강화 선택</div><div id="choiceCards"></div></div>
      <div id="score"></div>
      <div id="feed"></div>
      <canvas id="minimap"></canvas>
      <div id="stats"></div>
      <div id="flash"></div>
      <button id="mute" aria-label="소리 켜기/끄기">🔊</button>
      <button id="gear" aria-label="설정">⚙️</button>
      <div id="gas"></div>
      <div id="gasText" hidden></div>
      <div id="buffs"></div>
      <div id="toast" hidden><b id="toastTitle"></b><span id="toastSub"></span></div>
      <div id="dead" hidden><em>잡혔다!</em><span id="deadBy"></span><b id="respawn"></b></div>
      <div id="banner" hidden><b id="bannerTitle"></b><span id="bannerSub"></span><div id="bannerList"></div></div>
      <div id="stick"><div id="knob"></div></div>
      <button id="attack" class="skill" data-label="손전등" aria-label="손전등 공격">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 2.5h11l-2.2 6.2H8.7z" /><path d="M9 10h6v10.2a1.3 1.3 0 0 1-1.3 1.3h-3.4A1.3 1.3 0 0 1 9 20.2z" /><rect x="11" y="12.5" width="2" height="3.5" rx="1" fill="#000" opacity=".45" /></svg>
        <span>손전등</span>
      </button>
      <button id="roll" class="skill" data-label="구르기" aria-label="구르기">
        <i>🌀</i>
        <span>구르기</span>
      </button>
      <button id="flare" class="skill" data-label="조명탄" aria-label="조명탄">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.6" /><path d="M12 2v4M12 18v4M2 12h4M18 12h4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M19.1 4.9l-2.8 2.8M7.7 16.3l-2.8 2.8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" /></svg>
        <span>조명탄</span>
      </button>
    </div>

    <div id="menu">
      <div id="profileChip">
        <i id="avatar">🧭</i>
        <div>
          <input id="name" maxlength="12" placeholder="닉네임 입력" autocomplete="off" aria-label="닉네임" />
          <div id="rank"><b id="rankLv">모험가 Lv 1</b><div class="bar"><div id="rankFill"></div></div><small id="rankText"></small></div>
        </div>
      </div>
      <div id="lobbyLogo">FRUSTUM<small>한밤의 캠핑장 · 손전등 술래잡기</small></div>
      <div id="lobbyRight"><em id="coins">🪙 0</em><button id="openSettings" aria-label="설정">⚙️</button></div>
      <div id="lobbySide">
        <button id="openChars"><i>🧢</i><span>캐릭터</span></button>
        <button id="openShop"><i>🛍️</i><span>상점</span></button>
        <button id="openFriends"><i>👥</i><span>친구</span></button>
        <button id="daily" hidden><i>🎁</i><span>출석</span></button>
      </div>
      <div id="lobbyChar"><b id="lobbyCharName"></b><span id="lobbySkill"></span></div>
      <button id="modeCard"><small>모드 · 맵 바꾸기 ›</small><b id="modeText"></b><span id="mapText"></span></button>
      <div id="lobbyStart">
        <div id="roomTag" hidden></div>
        <div id="netToggle"><button id="netSolo">혼자 (봇전)</button><button id="netOnline">온라인</button></div>
        <button id="play">게임 시작</button>
      </div>
      <div id="status"></div>
    </div>

    <div id="modePanel" class="sheet" hidden>
      <div class="panel">
        <h2>모드와 맵</h2>
        <h3>규칙</h3>
        <div id="rules" class="pick">
          <button id="ruleDm">데스매치<small>3분 · 최다 킬</small></button>
          <button id="ruleScore">점수제<small>목표 킬 선취</small></button>
          <button id="ruleSurvival">서바이벌<small>부활 없음 · 독구름</small></button>
        </div>
        <h3>인원</h3>
        <div id="modes" class="pick">
          <button id="modeFfa">개인전<small>8명 각자</small></button>
          <button id="modeDuo">2인 팀전<small>2명 × 4팀</small></button>
        </div>
        <h3>맵</h3>
        <div id="maps" class="pick">
          <button id="mapAuto">순환<small>라운드마다 바뀜</small></button>
          <button id="mapCamp">캠핑장<small>오두막과 텐트</small></button>
          <button id="mapForest">소나무 숲<small>빽빽한 나무</small></button>
          <button id="mapLake">호숫가<small>가운데 호수</small></button>
        </div>
        <p class="note">맵 고르기는 혼자 하기와 친구 방(방 코드)에서 적용됩니다. 공개 온라인 방은 맵이 순환합니다.</p>
        <button id="closeModes">확인</button>
      </div>
    </div>

    <div id="friends" class="sheet" hidden>
      <div class="panel">
        <h2>친구와 함께</h2>
        <p class="note">같은 방 코드를 넣은 사람끼리 한 방에서 만납니다. 계정이 없어도 되고, 온라인 서버가 필요합니다.</p>
        <div class="roomRow">
          <input id="roomInput" maxlength="6" placeholder="방 코드" autocomplete="off" aria-label="방 코드" />
          <button id="roomMake">새 코드</button>
          <button id="roomShare">초대 링크</button>
        </div>
        <div id="roomState"></div>
        <h3>친구</h3>
        <div id="friendList" class="names"></div>
        <h3>최근 함께한 플레이어</h3>
        <div id="recentList" class="names"></div>
        <button id="closeFriends">닫기</button>
      </div>
    </div>

    <div id="shop" hidden>
      <div id="shopTabs">
        <button data-tab="chars">🧢 캐릭터</button>
        <button data-tab="skins">🎨 스킨</button>
        <button data-tab="gacha">✨ 뽑기</button>
      </div>
      <div id="shopCoins"></div>
      <button id="closeShop" aria-label="돌아가기">↩</button>
      <div id="shopHead"><b id="shopName"></b><span id="shopAbility"></span><span id="shopSkill"></span></div>
      <div id="shopLocks"></div>
      <button id="shopPrev" class="nav" aria-label="이전">‹</button>
      <button id="shopNext" class="nav" aria-label="다음">›</button>
      <div id="shopCount"></div>
      <div id="shopStats">
        <svg id="radar" viewBox="-96 -66 192 132" aria-hidden="true">
          <polygon class="grid" points="0,-44 44,0 0,44 -44,0" />
          <polygon class="grid" points="0,-22 22,0 0,22 -22,0" />
          <path class="grid" d="M0,-44V44M-44,0H44" />
          <polygon id="radarShape" points="" />
          <text x="0" y="-50">❤️ 체력</text>
          <text x="49" y="4" style="text-anchor: start">👟 속도</text>
          <text x="0" y="60">💥 공격</text>
          <text x="-49" y="4" style="text-anchor: end">사거리 🔦</text>
        </svg>
      </div>
      <button id="shopAct"></button>
      <div id="skinRow"></div>
      <div id="gachaPanel">
        <b>반딧불 뽑기</b>
        <p id="gachaOdds"></p>
        <p id="gachaPity"></p>
        <div class="btns"><button id="gacha1"></button><button id="gacha10"></button></div>
      </div>
      <div id="gachaResult" hidden><div id="gachaCards"></div><button id="gachaOk">확인</button></div>
    </div>

    <div id="rotate"><b>📱↻</b>화면을 가로로 돌려 주세요</div>

    <div id="settings" hidden>
      <div class="panel">
        <h2>설정</h2>
        <label><span>조이스틱 고정<small>항상 같은 자리에 표시</small></span><input type="checkbox" id="setFixed" /></label>
        <label><span>왼손 모드<small>조이스틱과 버튼 좌우 반전</small></span><input type="checkbox" id="setLefty" /></label>
        <label><span>회전 감도 <b id="sensVal"></b></span><input type="range" id="setSens" min="0.4" max="2.5" step="0.1" /></label>
        <label><span>카메라 거리 <b id="zoomVal"></b></span><input type="range" id="setZoom" min="0.7" max="1.2" step="0.05" /></label>
        <label><span>효과음 크기 <b id="volVal"></b></span><input type="range" id="setVol" min="0" max="1" step="0.05" /></label>
        <label><span>진동<small>처치하거나 당했을 때</small></span><input type="checkbox" id="setVibrate" /></label>
        <label><span>미니맵 표시<small>왼쪽 위 지도</small></span><input type="checkbox" id="setMinimap" /></label>
        <label><span>성능 정보 표시<small>fps, 드로우콜 등</small></span><input type="checkbox" id="setStats" /></label>
        <button id="closeSettings">닫기</button>
        <button id="leave" class="alt" hidden>게임 나가기</button>
      </div>
    </div>

    <script type="module" src="main.js"></script>
  </body>
</html>
