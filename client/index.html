<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="manifest.webmanifest" />
    <title>Frustum</title>
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
      { "imports": { "three": "./vendor/three/three.module.min.js" } }
    </script>
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="hud" hidden>
      <div id="score"></div>
      <div id="feed"></div>
      <div id="stats"></div>
      <div id="dead" hidden>처치당했습니다<span id="deadBy"></span><br /><b id="respawn"></b></div>
      <div id="stick"><div id="knob"></div></div>
      <button id="attack" aria-label="공격">공격</button>
    </div>

    <div id="menu">
      <h1>FRUSTUM</h1>
      <p>보이는 것은 내 시야뿐. 시야 밖에서 기습하세요.</p>
      <input id="name" maxlength="12" placeholder="닉네임" autocomplete="off" />
      <button id="play">혼자 하기 (봇전)</button>
      <button id="online" class="alt">온라인 접속</button>
      <small>모바일: 왼쪽 드래그 이동 · 오른쪽 드래그 회전 · 공격 버튼<br />PC: WASD 이동 · 마우스 드래그/←→ 회전 · Space 공격</small>
      <div id="status"></div>
    </div>

    <script type="module" src="main.js"></script>
  </body>
</html>
